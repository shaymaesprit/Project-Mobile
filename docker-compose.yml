services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studymate
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - studymate_postgres:/var/lib/postgresql/data

volumes:
  studymate_postgres:
